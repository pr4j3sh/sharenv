name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package archive
        run: |
          mkdir -p dist
          cp target/release/sharenv dist/
          cp LICENSE dist/
          tar -C dist -czf "dist/sharenv-${GITHUB_REF_NAME#v}-${{ matrix.target }}.tar.gz" sharenv LICENSE
          rm dist/sharenv dist/LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharenv-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 7

  release:
    name: Create GitHub release
    needs: binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: sharenv-*
          path: dist
          merge-multiple: true

      - name: Checksum and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --generate-notes

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify the package builds
        run: cargo publish --dry-run

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish
