config_version = 2
config_dir_name = ".sharenv"
config_file_path = ".sharenv/config.toml"

[api_config]
base_url = "http://localhost:8000"

[api_config.routes]
register = "/v1/auth/register"
login = "/v1/auth/login"
refresh = "/v1/auth/refresh"
logout = "/v1/auth/logout"
verify = "/v1/auth/verify"
resend = "/v1/auth/resend"
invitations = "/v1/invitations"
projects = "/v1/project/"
environments = "/v1/environment"
variables = "/v1/variable"
environment_name_param = "environment_name"

[auth]
token_service = "sharenv"
token_account = "default"

[environment_files]
environments = ["dev", "prod", "local"]
env_file_prefix = ".env"
