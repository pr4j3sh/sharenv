[package]
name = "sharenv"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23"
config = { version = "0.15", features = ["toml"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
futures = "0.3.28"
tokio = { version = "1.32.0", features = ["full"] }
zeroize = "1"
serde_json = "1.0.154"
toml = "1"
reqwest = { version = "0.13.5", features = ["json", "query"] }
keyring = "4.2.0"
rpassword = "7"
directories = "6.0.0"
libc = "0.2"
tempfile = "3.27.0"
anyhow = "1.0.104"
